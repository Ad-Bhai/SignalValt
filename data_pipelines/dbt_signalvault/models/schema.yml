version: 2

sources:
  - name: lakehouse_bronze
    description: "Raw lakehouse tables loaded from Kafka and S3"
    tables:
      - name: orders
        description: "Raw ingested customer order events"
        loaded_at_field: timestamp
        freshness:
          warn_after: {count: 15, period: minute}
          error_after: {count: 60, period: minute}
      - name: customers
        description: "Raw ingested customer registration profiles"

models:
  - name: stg_orders
    description: "Cleaned orders with customer_id resilience"
    columns:
      - name: order_id
        description: "Primary key for an order event"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null
      - name: amount
        description: "Order total amount in USD"
        tests:
          - not_null

  - name: fct_revenue
    description: "Aggregated daily revenue mart"
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: gross_revenue
        tests:
          - not_null

version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: signalvault-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:3.7
    container_name: signalvault-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper

  postgres:
    image: postgres:16-alpine
    container_name: signalvault-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=signalvault
      - POSTGRES_PASSWORD=signalvault_secret
      - POSTGRES_DB=signalvault_metadata
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: signalvault-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: signalvault-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://signalvault:signalvault_secret@postgres:5432/signalvault_metadata
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - kafka

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signalvault-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
